<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad: Wie spricht die Bibel von Gott?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2347; --ink2:#4A3B6B; --violet:#6B4FA0; --lila:#F4F0FA; --gold:#F2A93B; --gold2:#FDF1DD;
  --teal:#3E9C9E; --coral:#E46F5B; --green:#4E9A5B; --red:#C62828;
  --sand:#F6EBD6; --sand2:#E9D3A8; --olive:#6E8B3D; --nt:#E5F1EC; --nt2:#3E8A6E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#EFE9DD}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
svg{fill:currentColor}

/* Kopfleiste */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.bar .row{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .team{font-weight:800;font-size:15px;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .team small{display:block;font-weight:600;color:#CFC6E4;font-size:11px;letter-spacing:.5px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;border:none;color:#fff}
.pill svg{width:16px;height:16px;color:var(--gold)}
.pill.pts{background:var(--gold);color:var(--ink)} .pill.pts svg{color:var(--ink)}
.prog{max-width:880px;margin:10px auto 0;display:flex;gap:4px}
.prog span{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15);transition:.3s}
.prog span.done{background:var(--gold)} .prog span.now{background:#fff}
.prog span.bonus{flex:.6} .prog span.bonus.done{background:#FFD978}
.pop{position:fixed;left:50%;top:84px;transform:translateX(-50%) scale(.7);opacity:0;background:var(--gold);color:var(--ink);font-weight:800;padding:8px 18px;border-radius:999px;z-index:50;transition:.25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pop.show{opacity:1;transform:translateX(-50%) scale(1)}

/* Seite */
.wrap{max-width:880px;margin:22px auto 60px;padding:0 16px}
.page{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(46,35,71,.14);padding:30px 34px;min-height:480px;animation:fade .4s ease;position:relative;overflow:hidden}
.page.at{background:linear-gradient(180deg,var(--sand) 0,#fff 220px)}
.page.nt{background:linear-gradient(180deg,var(--nt) 0,#fff 220px)}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:600px){.page{padding:22px 18px}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--lila);color:var(--violet)}
.kicker.at{background:var(--sand2);color:#7A4E12} .kicker.nt{background:#CDE6DB;color:#25624B} .kicker.bonus{background:#FFF2C4;color:#8A6400}
.kicker svg{width:14px;height:14px}
.shead{display:flex;gap:16px;align-items:center;margin:14px 0 4px}
.shead .ic{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.shead .ic svg{width:32px;height:32px}
h1{font-size:29px;line-height:1.15;font-weight:800}
.shead .sub{font-size:15px;font-weight:700;color:#7A6F96}
h2{font-size:20px;margin:26px 0 8px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--gold);font-size:14px}
h2 .pt{margin-left:auto;font-size:12px;font-weight:800;color:#9A5B00;background:var(--gold2);padding:3px 10px;border-radius:999px;white-space:nowrap}
h2 .pt.ok{background:#E8F4EA;color:var(--green)}
p{font-size:17px;line-height:1.55;margin:8px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.meta span{font-size:13px;font-weight:700;background:#fff;border:1.5px solid #D8D0E8;color:var(--ink2);padding:3px 10px;border-radius:999px}
.story{background:#FFFDF6;border:1px solid #EADFC8;border-radius:12px;padding:16px 20px;margin:14px 0;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.story p{font-size:17px}
.verse{border-left:5px solid var(--gold);background:var(--gold2);border-radius:0 12px 12px 0;padding:12px 18px;margin:14px 0;font-size:18px;line-height:1.5;font-style:italic}
.verse cite{display:block;font-style:normal;font-size:13px;font-weight:800;color:#9A5B00;margin-top:4px}
.verse a{color:#9A5B00}
.info{background:var(--lila);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16px;line-height:1.5;display:flex;gap:12px}
.info svg{width:22px;height:22px;flex:none;color:var(--violet);margin-top:2px}
.info.warm{background:#FDECEC}.info.warm svg{color:var(--coral)}
.task{font-size:17px;line-height:1.5;font-weight:700;margin:6px 0 10px}
.hint{font-size:14px;color:#7A6F96;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:800;background:var(--violet);color:#fff;box-shadow:0 3px 0 #4A3577;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4A3577}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #C98516}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:10px;flex-wrap:wrap}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* MC */
.opts{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.opt{text-align:left;border:2px solid #D8D0E8;background:#fff;border-radius:12px;padding:12px 16px;font-size:16.5px;font-weight:600;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.opt b{display:inline-flex;min-width:28px;height:28px;border-radius:50%;background:var(--lila);color:var(--violet);align-items:center;justify-content:center;font-weight:800}
.opt.right{border-color:var(--green);background:#E8F4EA}.opt.right b{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--coral);background:#FCEDEA;opacity:.75}
.opt.picked{border-color:var(--gold);background:var(--gold2)}
.expl{background:#E8F4EA;border-radius:10px;padding:12px 16px;margin-top:8px;font-size:16px;line-height:1.5}
/* Text */
textarea{width:100%;min-height:110px;border:2px solid #D8D0E8;border-radius:12px;padding:12px 14px;font-family:'Patrick Hand',cursive;font-size:21px;line-height:1.4;color:#2B4A8B;background:#fff;resize:vertical}
textarea:focus{outline:none;border-color:var(--violet)}
.cnt{font-size:13px;font-weight:700;color:#7A6F96;text-align:right;margin-top:4px}.cnt.ok{color:var(--green)}
/* Zuordnen */
.chips{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.chip{text-align:left;border:2px solid #D8D0E8;background:#fff;border-radius:12px;padding:11px 14px;font-size:16px;font-weight:700;color:var(--ink);transition:.15s;line-height:1.4}
.chip.on{border-color:var(--gold);background:var(--gold2);box-shadow:0 0 0 3px rgba(242,169,59,.3)}
.chip.ok{border-color:var(--green);background:#E8F4EA;color:#2D6B38}
.chip small{display:block;font-weight:700;color:#9A8F7A;font-size:12.5px}
.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.targets.t4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.targets,.targets.t4{grid-template-columns:repeat(2,1fr)}}
.tg{background:#fff;border:2px solid #D8D0E8;border-radius:14px;padding:12px 8px;text-align:center;transition:.15s;font-weight:800;font-size:16px;color:var(--ink)}
.tg svg{width:40px;height:40px;color:var(--violet);display:block;margin:0 auto 6px}
.tg.ok{border-color:var(--green);background:#E8F4EA}.tg.ok svg{color:var(--green)}
.tg .m{font-size:12.5px;font-weight:700;color:#2D6B38;margin-top:5px;line-height:1.3}
.tg.txt{font-size:14.5px;font-weight:700;text-align:left;line-height:1.35;padding:12px}
/* Sortieren */
.sort{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.sitem{background:#fff;border:2px solid #D8D0E8;border-radius:12px;padding:10px 14px}
.sitem .t{font-size:16.5px;font-weight:600;line-height:1.4}
.sitem .cs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cbtn{border:2px solid #D8D0E8;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;color:var(--ink2)}
.cbtn.right{background:var(--green);border-color:var(--green);color:#fff}
.cbtn.wrong{background:#FCEDEA;border-color:var(--coral);color:var(--coral);text-decoration:line-through}
/* Reihenfolge */
.timeline{counter-reset:t;display:flex;flex-direction:column;gap:6px;margin:10px 0;padding-left:6px;border-left:4px solid var(--sand2)}
.tl{position:relative;background:#fff;border-radius:10px;padding:9px 12px 9px 44px;font-size:16px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tl:before{counter-increment:t;content:counter(t);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px}
.tl.empty{background:transparent;box-shadow:none;border:2px dashed #D9CBAE;color:#B9A884;font-weight:600}
.pool{display:flex;flex-direction:column;gap:8px;margin:12px 0}
/* Hebräisch */
.heb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.hl{width:78px;height:96px;border-radius:14px;border:2px solid #D9CBAE;background:#FFFDF6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.hl .h{font-family:'Frank Ruhl Libre','Times New Roman',serif;font-size:44px;line-height:1;color:var(--ink)}
.hl .l{font-size:13px;color:#9A8F7A;margin-top:4px}
.hl.used{opacity:.25}
.hres{direction:rtl;display:flex;gap:6px;justify-content:center;min-height:70px;align-items:center;font-family:'Frank Ruhl Libre','Times New Roman',serif;font-size:56px;color:var(--violet);background:var(--sand);border-radius:14px;padding:6px 14px}
.hres i{font-style:normal;color:#C9B994;font-size:36px}
/* Gleichnis */
.scene{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid #D8E8E1;border-radius:14px;padding:12px 16px;margin:10px 0;animation:fade .4s}
.scene .no{min-width:34px;height:34px;border-radius:50%;background:var(--nt2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.scene p{margin:0;font-size:16.5px}
/* Lückentext */
.merk{background:var(--ink);color:#fff;border-radius:16px;padding:20px 22px;font-size:18px;line-height:2.3;margin:12px 0}
.merk select{font-family:inherit;font-size:16px;font-weight:700;border-radius:8px;border:2px solid var(--gold);padding:3px 6px;background:#fff;color:var(--ink)}
.merk select.right{border-color:#7BD389;background:#E8F4EA}.merk select.wrong{border-color:var(--coral);background:#FCEDEA}
.merk .fix{color:#FFD978;font-weight:800;font-size:14px;margin-left:4px}

/* Karte */
.zone{border-radius:18px;padding:18px 18px 10px;margin:16px 0}
.zone.at{background:var(--sand)} .zone.nt{background:var(--nt)} .zone.end{background:var(--lila)}
.zone h3{font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone.at h3{color:#7A4E12} .zone.nt h3{color:#25624B} .zone.end h3{color:var(--violet)}
.zone h3 svg{width:18px;height:18px;flex:none}
.zone h3 small{font-weight:700;letter-spacing:0;text-transform:none;color:#7A6F96;font-size:13px}
.path{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.path{grid-template-columns:1fr}}
.stc{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:14px;border:2px solid transparent;text-align:left;color:var(--ink);box-shadow:0 2px 8px rgba(46,35,71,.08);transition:.15s}
.stc:active{transform:scale(.98)}
.stc .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;position:relative}
.stc .ic svg{width:26px;height:26px}
.stc .ic .ck{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--green);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.stc .ic .ck svg{width:11px;height:11px}
.stc .no{font-size:11px;font-weight:800;letter-spacing:.8px;color:#9A8F7A;text-transform:uppercase}
.stc .t{font-size:17px;font-weight:800;line-height:1.2}
.stc .s{font-size:13px;font-weight:600;color:#7A6F96}
.stc .p{margin-left:auto;font-size:13px;font-weight:800;color:#9A5B00;background:var(--gold2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.stc.done{border-color:#BFE0C5}.stc.done .p{background:#E8F4EA;color:var(--green)}
.stc.lock{opacity:.5}.stc.lock .ic{background:#B9B1CC!important}
.stc.next{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,169,59,.25)}
/* Start / Ziel */
.hero{text-align:center;padding:10px 0}
.hero .badge{width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.hero .badge svg{width:46px;height:46px}
input[type=text]{font-family:inherit;font-size:18px;font-weight:700;border:2px solid #D8D0E8;border-radius:12px;padding:12px 14px;width:100%;max-width:420px;color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0;text-align:left}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rules div{background:var(--lila);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.rules b{display:block;color:var(--violet);font-size:16px;margin-bottom:2px}
.card{background:var(--ink);color:#fff;border-radius:18px;padding:26px;text-align:center;margin:18px auto;max-width:520px;box-shadow:0 8px 24px rgba(46,35,71,.3)}
.card .big{font-size:58px;font-weight:800;color:var(--gold);line-height:1}
.card .rank{font-family:'Patrick Hand';font-size:30px;margin:10px 0 4px}
.card .code{display:inline-block;margin-top:14px;background:#fff;color:var(--ink);font-weight:800;letter-spacing:3px;padding:8px 16px;border-radius:10px;font-size:22px}
.stats{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}.stats b{display:block;font-size:20px}
.credit{text-align:center;font-size:12px;color:#8A7F6A;margin-top:16px}
.teacher{position:fixed;bottom:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;font-size:13px;font-weight:800;padding:5px;z-index:30}
.sol{display:none;margin-top:10px;background:#FDECEC;border:2px dashed var(--red);border-radius:10px;padding:10px 14px;font-size:14.5px;color:#8B1C1C;line-height:1.5}
body.lehrer .sol{display:block}
.reset{background:none;border:none;color:#9A8F7A;font-size:13px;font-weight:700;text-decoration:underline}
.note{background:var(--gold2);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16px;line-height:1.5}

/* Kopfbilder & Szenen */
.banner{position:relative;margin:-30px -34px 20px;height:clamp(150px,28vw,240px);overflow:hidden;border-radius:18px 18px 0 0}
.banner>svg{width:100%;height:100%;display:block}
.ribbon{position:absolute;left:18px;bottom:14px;display:inline-flex;align-items:center;gap:7px;background:rgba(46,35,71,.88);color:#fff;font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.ribbon svg{width:14px;height:14px;color:var(--gold)}
@media (max-width:600px){.banner{margin:-22px -18px 16px}}
.scene .no.ic{min-width:46px;height:46px;color:#fff}.scene .no.ic svg{width:24px;height:24px}
.scene p{margin:4px 0}
.sitem{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:start}
.sitem .si{grid-row:span 2;width:46px;height:46px;border-radius:12px;background:var(--sand);color:#8A5A1F;display:flex;align-items:center;justify-content:center}
.sitem .si svg{width:28px;height:28px}
.oi{display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--sand);color:#8A5A1F;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle;flex:none}
.oi svg{width:18px;height:18px}
.ochip{display:flex;align-items:center}
.tl{display:flex;align-items:center}
h2 .n svg{width:14px;height:14px}
/* Reisekarte */
.page.mappage{padding:22px 22px 26px;background:#FBF4E4}
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tally{display:flex;gap:6px}.tally span{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;color:#fff}
.tally .at{background:#A0612A}.tally .nt{background:#2F6F59}
.map{position:relative;width:100%;aspect-ratio:1000/1250;border-radius:16px;overflow:hidden;border:6px solid #fff;box-shadow:0 0 0 2px #C9A86A,0 10px 26px rgba(107,74,30,.25)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:3%;bottom:2.5%;background:rgba(251,244,228,.92);border:1.5px solid #C9A86A;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:3px;font-size:clamp(10px,1.6vw,13px);font-weight:800;color:#5A4320}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.startlbl{position:absolute;transform:translate(-50%,-50%);background:#7A4E12;color:#fff;font-weight:800;font-size:clamp(10px,1.7vw,14px);padding:3px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk{position:absolute;transform:translate(-50%,-50%);background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;z-index:2}
.mk .dot{position:relative;width:clamp(42px,8.4vw,72px);height:clamp(42px,8.4vw,72px);border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 4px 12px rgba(60,40,10,.35);transition:transform .15s}
.mk .dot svg{width:48%;height:48%}
.mk:active .dot{transform:scale(.94)}
.mk .nr{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:#2E2347;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.mk .ck{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--green);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.mk .ck svg{width:11px;height:11px}
.mk .lb{background:rgba(255,253,246,.95);border:1.5px solid #C9A86A;border-radius:10px;padding:3px 9px;text-align:center;line-height:1.15;box-shadow:0 2px 6px rgba(0,0,0,.12);max-width:clamp(110px,22vw,180px)}
.mk .lb b{display:block;font-size:clamp(10.5px,1.75vw,14.5px);color:#2E2347}
.mk .lb small{display:block;font-size:clamp(9px,1.4vw,11.5px);color:#7A6F96;font-weight:700}
.mk.lock .dot{background:#B9AE98;box-shadow:0 2px 6px rgba(0,0,0,.2)}.mk.lock .lb{opacity:.75}
.mk.done .dot{box-shadow:0 0 0 4px var(--green),0 4px 12px rgba(60,40,10,.35)}
.mk.next .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,59,.9),0 4px 12px rgba(60,40,10,.35)}70%{box-shadow:0 0 0 18px rgba(242,169,59,0),0 4px 12px rgba(60,40,10,.35)}100%{box-shadow:0 0 0 0 rgba(242,169,59,0),0 4px 12px rgba(60,40,10,.35)}}
.hiker{position:absolute;transform:translate(70%,-160%);width:clamp(26px,4.6vw,40px);height:clamp(26px,4.6vw,40px);color:#2E2347;z-index:3;animation:hop 1s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(255,255,255,.9))}
.hiker svg{width:100%;height:100%}
@keyframes hop{50%{margin-top:-8px}}
.meta .ort{display:inline-flex;align-items:center;gap:5px;background:#2E2347!important;color:#fff!important;border-color:#2E2347!important}
.meta .ort svg{width:12px;height:12px;color:var(--gold)}

.mlist{display:none}

 .mk .lb{display:none}.legend{display:none}.startlbl{font-size:10px;padding:2px 7px}
 .mlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
 .mlist button{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #E6D6B4;border-radius:14px;padding:10px 12px;text-align:left;color:var(--ink)}
 .mlist button:disabled{opacity:.55}.mlist button.done{border-color:#BFE0C5}
 .mlist .d{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}.mlist .d svg{width:18px;height:18px}
 .mlist b{display:block;font-size:15px}.mlist small{display:block;font-size:12px;color:#7A6F96;font-weight:700}

const KEY='lernpfad-bibel-gott-v1';

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function D(k,v){if(v===undefined)return S.data[k];S.data[k]=v;save()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a,seed){a=a.slice();let s=seed||7;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(t){const p=document.getElementById('pop');p.textContent=t;p.className='pop show';clearTimeout(p._t);p._t=setTimeout(()=>p.className='pop',1300)}
function addPts(n,st,label){if(n>0){S.pts+=n;S.sp[st]=(S.sp[st]||0)+n;save();upd();pop('+'+n+' Punkte'+(label?' · '+label:''))}}
function taskDone(st,key){D(key+'_ok',1);const s=SID[st];if(s.tasks.every(k=>D(k+'_ok'))&&!S.done[st]){S.done[st]=true;save();setTimeout(()=>pop('Station geschafft!'),900)}}
const isOk=k=>!!D(k+'_ok');

function unlocked(st){if(LEHRER)return true;const s=SID[st];
  if(s.part===1)return true;
  if(s.part===2)return ST.filter(x=>x.part===1).every(x=>S.done[x.id]);
  if(st==='check')return ST.filter(x=>x.part<3).every(x=>S.done[x.id]);
  if(st==='bonus')return !!S.done.check;return false}
function nextOpen(){return ST.find(s=>!S.done[s.id]&&unlocked(s.id)&&!s.bonus)}

function upd(){
  document.getElementById('pts').textContent=S.pts;
  document.getElementById('teamName').innerHTML=esc(S.team)+'<small>LERNPFAD · WIE SPRICHT DIE BIBEL VON GOTT?</small>';
  document.getElementById('prog').innerHTML=ST.map(s=>`<span title="${s.t}" class="${s.bonus?'bonus ':''}${S.done[s.id]?'done':''} ${S.cur===s.id?'now':''}"></span>`).join('');
}
function tick(){if(!S.start)return;const t=Math.floor(((S.end||Date.now())-S.start)/1000);const e=document.getElementById('time');if(e)e.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}

function go(id){S.cur=id;save();render(true);window.scrollTo({top:0,behavior:'smooth'})}
function render(anim){
  const pg=document.getElementById('page');const id=S.cur;
  document.getElementById('bar').style.display=id==='start'?'none':'block';
  upd();tick();
  const st=SID[id];pg.className='page'+(st?(st.part===1?' at':st.part===2?' nt':''):'')+(id==='karte'?' mappage':'');
  pg.innerHTML=(R[id]||R.karte)();
  if(anim){pg.style.animation='none';pg.offsetHeight;pg.style.animation=''}
  (H[id]||(()=>{}))();
  bindWidgets();
}

function banner(id){const s=SID[id];if(!BAN[id])return '';

function scn(icon,col,html){return `<div class="scene"><div class="no ic" style="background:${col}">${I[icon]}</div><div>${html}</div></div>`}

/* ---------- Bausteine ---------- */
function stHead(id){const s=SID[id];const part=s.part===1?'Teil 1 · Altes Testament':s.part===2?'Teil 2 · Neues Testament':s.bonus?'Bonus':'Abschluss';
  const k=s.part===1?'at':s.part===2?'nt':s.bonus?'bonus':'';const nr=ST.indexOf(s)+1;
  return `${banner(id)}<span class="kicker ${k}">${I.book}${s.bonus?'Bonusstation':s.id==='check'?'Abschluss-Check':'Station '+nr+' · '+part}</span>
  <div class="shead"><div class="ic" style="background:${s.col}">${I[s.ic]}</div><div><h1>${s.t}</h1><div class="sub">${s.s}</div></div></div>
  <div class="meta"><span class="ort">${I.pin}${s.ort}</span><span>${s.soz}</span><span>max. ${s.max} Punkte</span></div>`}
function hT(n,title,pts,key){return `<h2><span class="n">${n}</span>${title}${pts?`<span class="pt ${key&&isOk(key)?'ok':''}">${key&&isOk(key)?'✓ erledigt':pts+' P.'}</span>`:''}</h2>`}
function stNav(id){const s=SID[id];const nx=nextOpen();const done=S.done[id];
  let right='';
  if(done){if(nx)right=`<button class="btn gold" onclick="go('${nx.id}')">Weiter nach: ${nx.ort} →</button>`;
    else if(!S.done.bonus&&unlocked('bonus')&&id!=='bonus')right=`<button class="btn gold" onclick="go('bonus')">⭐ Zur Bonusstation →</button>`;
    else right=`<button class="btn gold" onclick="finishAll()">Zur Punktekarte →</button>`}
  else right=`<span class="hint">Löse alle Aufgaben dieser Station.</span>`;
  return `<div class="nav"><button class="btn ghost" onclick="go('karte')">${I.map} Zur Karte</button>${right}</div>`}
function finishAll(){if(!S.end){S.end=Date.now();save()}go('ziel')}

/* Multiple Choice: eine richtige Antwort, Punkte sinken bei Fehlversuchen */
function mc(st,key,q,opts,right,expl,pts){const a=D(key);const tries=D(key+'t')||[];
  return `${q?`<p class="task">${q}</p>`:''}<div class="opts" data-mc="${key}" data-st="${st}" data-r="${right}" data-p="${pts}">${opts.map((o,i)=>{
    let c='';if(a!==undefined&&i===right)c='right';else if(tries.includes(i))c='wrong';
    return `<button class="opt ${c}" data-i="${i}" ${a!==undefined?'disabled':''}><b>${'ABCD'[i]}</b><span>${o}</span></button>`}).join('')}</div>
  ${a!==undefined&&expl?`<div class="expl">${expl}</div>`:''}`}
/* Freitext */
function txt(st,key,ph,min,pts){const v=D(key)||'';const done=isOk(key);
  return `<textarea data-tx="${key}" data-st="${st}" data-min="${min}" data-p="${pts}" maxlength="400" placeholder="${ph}" ${done?'readonly':''}>${esc(v)}</textarea>
  <div class="cnt ${done?'ok':''}" id="${key}c">${done?'✓ abgegeben':'noch '+Math.max(0,min-v.trim().length)+' Zeichen'}</div>
  ${done?'':`<div style="margin-top:8px"><button class="btn" id="${key}b">Abgeben (+${pts})</button></div>`}`}
/* Zuordnen: Kärtchen antippen, dann Ziel antippen */
function match(st,key,items,targets,pts,cls){const m=D(key)||{};
  return `<div class="targets ${cls||''}" data-mt="${key}">${targets.map(t=>`<div class="tg ${t.txt?'txt':''} ${m[t.id]?'ok':''}" data-k="${t.id}">${t.ic?I[t.ic]:''}${t.label}${m[t.id]&&t.m?`<div class="m">${t.m}</div>`:''}</div>`).join('')}</div>
  <div class="chips" data-mi="${key}" data-st="${st}" data-p="${pts}" data-n="${items.length}">${items.map(i=>`<button class="chip ${m[i.id]?'ok':''}" data-k="${i.id}" ${m[i.id]?'disabled':''}>${i.label}</button>`).join('')}</div>`}
/* Sortieren in zwei Kategorien, ein Versuch je Karte */
function sort2(st,key,items,cats,pts){const a=D(key)||{};
  return `<div class="sort" data-so="${key}" data-st="${st}" data-p="${pts}" data-n="${items.length}">${items.map((it,i)=>`<div class="sitem">${it[2]?`<span class="si">${I[it[2]]}</span>`:''}<div class="t">${it[0]}</div><div class="cs" data-i="${i}" data-r="${it[1]}">${cats.map((c,j)=>{let cl='';if(a[i]!==undefined){if(j===it[1])cl='right';else if(j===a[i])cl='wrong'}return `<button class="cbtn ${cl}" data-j="${j}" ${a[i]!==undefined?'disabled':''}>${c}</button>`}).join('')}</div></div>`).join('')}</div>`}
/* Reihenfolge */
function order(st,key,evs,pts,ics){ics=ics||[];const ic=i=>ics[i]?`<span class="oi">${I[ics[i]]}</span>`:'';const placed=D(key)||[];const err=D(key+'e')||{};const pool=shuffle(evs.map((e,i)=>i),13).filter(i=>!placed.includes(i));
  return `<div class="timeline">${evs.map((e,i)=>placed[i]!==undefined?`<div class="tl">${ic(placed[i])}${evs[placed[i]]}</div>`:`<div class="tl empty">${i===placed.length?'Was passiert als Nächstes? Tippe unten.':'…'}</div>`).join('')}</div>
  ${pool.length?`<div class="pool" data-or="${key}" data-st="${st}" data-p="${pts}" data-n="${evs.length}">${pool.map(i=>`<button class="chip ochip" data-i="${i}">${ic(i)}<span>${evs[i]}</span></button>`).join('')}</div>`:''}`}

function bindWidgets(){
  // MC
  document.querySelectorAll('[data-mc]').forEach(box=>{const key=box.dataset.mc,st=box.dataset.st,r=+box.dataset.r,p=+box.dataset.p;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,tries=D(key+'t')||[];
      if(i===r){D(key,i);addPts(tries.length===0?p:tries.length===1?Math.round(p/2):0,st,tries.length?'':'Volltreffer!');taskDone(st,key);render(false)}
      else{tries.push(i);D(key+'t',tries);b.classList.add('wrong','shake');setTimeout(()=>b.classList.remove('shake'),400)}})});
  // Text
  document.querySelectorAll('[data-tx]').forEach(t=>{const key=t.dataset.tx,st=t.dataset.st,min=+t.dataset.min,p=+t.dataset.p;const c=document.getElementById(key+'c'),b=document.getElementById(key+'b');
    if(!b)return;const chk=()=>{const n=t.value.trim().length;c.textContent=n>=min?'✓ lang genug':'noch '+(min-n)+' Zeichen';c.className='cnt'+(n>=min?' ok':'');b.disabled=n<min};
    t.oninput=()=>{D(key,t.value);chk()};chk();b.onclick=()=>{addPts(p,st,'gut formuliert!');taskDone(st,key);render(false)}});
  // Zuordnen
  document.querySelectorAll('[data-mi]').forEach(box=>{const key=box.dataset.mi,st=box.dataset.st,p=+box.dataset.p,n=+box.dataset.n;let sel=null;
    const tg=document.querySelector(`[data-mt="${key}"]`);
    box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');sel=c.dataset.k});
    tg.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{const m=D(key)||{},tr=D(key+'t')||{};if(!sel||m[t.dataset.k]){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);return}

<div class="nav"><button class="btn ghost" onclick="go('karte')">${I.map} Karte</button><button class="btn gold" onclick="go('ergebnis')">Unsere Ergebnisse →</button></div>`};

/* ---------- Ergebnisse (PDF) ---------- */
function A(k){return esc(D(k)||'')||'<span style="color:#B0A6C6">– noch nicht bearbeitet</span>'}
function resultPages(){
  const t=Math.floor(((S.end||Date.now())-S.start)/1000);
  const head=(c,k,tt)=>`<div class="hd" style="background:${c}"><div><div class="k">${k}</div><div class="t">${tt}</div></div><div class="tm">Team<b>${esc(S.team)}</b>${S.pts} Punkte</div></div>`;

  const a=D('chk')||GAPS;const g=a.map((x,i)=>x===GAPS[i]?x:GAPS[i]);
  const p1=`<div class="a4">${head('#8A5A1F','TEIL 1 · ALTES TESTAMENT','Wie spricht die Bibel von Gott?')}
  <div class="sec"><div class="st"><i>1</i>Der Dornbusch – Gottes Name<span>2. Mose 3</span></div>
   <div class="two"><div class="bx s" style="display:flex;gap:14px;align-items:center"><div class="yhwh">יהוה</div><div><b>JHWH</b> – „Ich werde sein, der ich sein werde“ (Ex 3,14): <b>Ich bin da.</b> Lutherbibel: HERR. Juden sprechen den Namen aus Ehrfurcht nicht aus („Adonai“).</div></div>
   <div><div class="lab" style="margin-top:0">Hier wünsche ich mir, dass Gott da ist:</div><div class="ans">${A('s1t')}</div></div></div></div>
  <div class="sec"><div class="st"><i>2</i>Kein Bildnis – das Bilderverbot<span>2. Mose 20,4</span></div>
   <div class="two"><div class="bx"><b>Bildnis (verboten):</b> Figuren oder Bilder, die Gott festlegen und angebetet werden – z. B. das Goldene Kalb.<br><b>Sprachbild (erlaubt):</b> Vergleiche wie Hirte, Licht, Mutter.<br>Gott ist größer als jedes Bild und lässt sich nicht besitzen.</div>
   <div><div class="lab" style="margin-top:0">Widerspruch oder nicht? Unsere Meinung:</div><div class="ans">${A('s2t')}</div></div></div></div>
  <div class="sec"><div class="st"><i>3</i>Der Gott, der befreit – Exodus und Bund</div>
   <div class="tl5">${S3E.map((e,i)=>`<div><b>${i+1}</b>${e}</div>`).join('')}</div>
   <div class="bx s" style="margin-top:7px"><b>Bund:</b> eine feste Beziehung, ein gegenseitiges Versprechen. Erst befreit Gott, dann gibt er die Gebote – als Leitplanken für ein Leben in Freiheit (Ex 20,2; 24,7).</div></div>
  <div class="sec"><div class="st"><i>4</i>Bilder für Gott in den Psalmen</div>
   <div class="ps">${PS.map(p=>`<div><b>${p.label}</b>${p.m}</div>`).join('')}</div>
   <div class="lab">Gott ist für mich wie …</div><div class="ans">${A('s4t')}</div></div>
  <div class="sec"><div class="st"><i>✎</i>Platz für Notizen</div><div class="lines"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
  ${ft(1)}</div>`;
  const p2=`<div class="a4">${head('#2F6F59','TEIL 2 · NEUES TESTAMENT','Wie spricht die Bibel von Gott?')}
  <div class="sec"><div class="st"><i>5</i>Abba – lieber Vater<span>Markus 14,36 · Matthäus 6,9</span></div>
   <div class="bx"><b>Abba</b> (aramäisch) = vertrautes Wort für den Vater, wie „Papa“. Jesus zeigt: Gott ist nah, man kann mit ihm reden wie ein Kind mit einem liebevollen Vater. „Vater“ ist ein Sprachbild – Gott tröstet auch wie eine Mutter (Jes 66,13).</div>
   <div class="vu" style="margin-top:7px">${VU.map(v=>`<div><b>${v.label}</b><span>${v.p}</span></div>`).join('')}</div>
   <div class="lab">Unsere eigene Zeile:</div><div class="ans">${A('s5t')}</div></div>
  <div class="sec"><div class="st"><i>6</i>Der barmherzige Vater<span>Lukas 15,11–32</span></div>
   <div class="bx">Der Vater läuft dem Sohn entgegen, bevor dieser sich entschuldigen kann. So ist Gott: <b>barmherzig</b> – er nimmt Menschen ohne Vorbedingung wieder auf.</div>
   <div class="lab">Perspektivwechsel – unsere Nachricht an den Vater:</div><div class="ans">${A('s6t')}</div></div>
  <div class="sec"><div class="st"><i>7</i>Merksatz</div>
   <div class="merk2">Am Dornbusch nennt Gott seinen Namen JHWH: „Ich bin <u>${g[0]}</u>“. Weil Gott größer ist als jede Vorstellung, gibt es das <u>${g[1]}</u>. Gott hat sein Volk aus Ägypten <u>${g[2]}</u> und am Sinai einen <u>${g[3]}</u> mit ihm geschlossen. Die Psalmen sprechen in <u>${g[4]}</u> von Gott, zum Beispiel als Hirte oder Fels. Jesus nennt Gott „<u>${g[5]}</u>“ – lieber Vater. Im Gleichnis vom verlorenen Sohn zeigt Jesus: Gott <u>${g[6]}</u> den Menschen und nimmt sie wieder auf.</div></div>

<p>Hier ist alles zusammengestellt, was ihr bearbeitet habt – Teil 1 und Teil 2 auf je einer A4-Seite. Ihr könnt das PDF jederzeit erstellen, z. B. schon am Ende von Teil 1.</p>

  pv.querySelectorAll('.sc>.a4').forEach(e=>e.style.transform=`scale(${sc})`);

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
let PDF=null;
async function makePdf(){const st=document.getElementById('pdfst'),b=document.getElementById('mkpdf');b.disabled=true;st.textContent='PDF wird erstellt …';
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');try{await document.fonts.ready}catch(e){}
    let cap=document.getElementById('cap');if(!cap){cap=document.createElement('div');cap.id='cap';document.body.appendChild(cap)}
    cap.innerHTML=resultPages().join('');const els=[...cap.querySelectorAll('.a4')],jpgs=[];
    for(let i=0;i<els.length;i++){st.textContent=`Seite ${i+1} von ${els.length} …`;
      const c=await html2canvas(els[i],{scale:2.6,backgroundColor:'#ffffff',logging:false});
      const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));jpgs.push({w:c.width,h:c.height,b:new Uint8Array(await bl.arrayBuffer())})}
    cap.innerHTML='';
    PDF=new File([imagePdf(jpgs)],'Lernpfad_Bibel_Gott_'+(S.team||'Team').replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_')+'.pdf',{type:'application/pdf'});
    st.textContent='';
    b.outerHTML=`<button class="btn gold" id="share">In GoodNotes öffnen</button><button class="btn ghost" id="dl">PDF herunterladen</button>`;
    const sh=document.getElementById('share');
    if(navigator.canShare&&navigator.canShare({files:[PDF]}))sh.onclick=()=>navigator.share({files:[PDF],title:'Lernpfad – Wie spricht die Bibel von Gott?'}).catch(()=>{});else sh.remove();
    document.getElementById('dl').onclick=()=>{const u=URL.createObjectURL(PDF);const a=document.createElement('a');a.href=u;a.download=PDF.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
  }catch(e){st.textContent='Das PDF konnte nicht erstellt werden. Ist das iPad mit dem Internet verbunden?';b.disabled=false;console.error(e)}}
/* Minimaler PDF-Baustein: pro Seite genau ein JPEG, keine Schriften (GoodNotes-freundlich) */
function imagePdf(imgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n=imgs.length,W=595.28,Hh=841.89;const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n')};
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add('<< /Type /Pages /Count '+n+' /Kids ['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
  imgs.forEach((im,i)=>{const pg=3+i*3,ct=pg+1,ix=pg+2;const cs='q '+W+' 0 0 '+Hh+' 0 0 cm /Im0 Do Q';
    obj(pg,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+Hh+'] /Resources << /XObject << /Im0 '+ix+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(ct,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(ix,()=>{add('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.b.length+' >>\nstream\n');add(im.b);add('\nendstream')})});
  const total=3+n*3,x=len;let xr='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(xr+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'})}

if(!S.start)S.cur='start';
render(true);
