<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helens Religionsheft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2347; --ink2:#4A3B6B; --violet:#6B4FA0; --lila:#F4F0FA; --gold:#F2A93B; --gold2:#FDF1DD;
  --teal:#3E9C9E; --coral:#E46F5B; --green:#4E9A5B; --red:#C62828; --grid:#DCE8F4; --margin:#F1A6A6;
  --desk:#E9E3D6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--desk)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.hand{font-family:'Patrick Hand','Comic Sans MS',cursive}

/* Kopfleiste */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.bar .row{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .team{font-weight:800;font-size:15px;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .team small{display:block;font-weight:600;color:#CFC6E4;font-size:11px;letter-spacing:.5px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px}
.pill svg{width:16px;height:16px;fill:var(--gold)}
.pill.pts{background:var(--gold);color:var(--ink)} .pill.pts svg{fill:var(--ink)}
.prog{max-width:860px;margin:10px auto 0;display:flex;gap:4px}
.prog span{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15);transition:.3s}
.prog span.done{background:var(--gold)} .prog span.now{background:#fff}
.prog span.bonus.done{background:#FFD978}
.pop{position:fixed;left:50%;top:84px;transform:translateX(-50%) scale(.7);opacity:0;background:var(--gold);color:var(--ink);font-weight:800;padding:8px 18px;border-radius:999px;z-index:50;transition:.25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pop.show{opacity:1;transform:translateX(-50%) scale(1)}
.pop.neg{background:#fff;color:var(--red)}

/* Heftseite */
.wrap{max-width:860px;margin:22px auto 60px;padding:0 16px}
.page{position:relative;background-color:#fff;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;border-radius:6px 14px 14px 6px;box-shadow:0 10px 30px rgba(46,35,71,.18),0 1px 0 #d9d2c3;
  padding:34px 34px 34px 64px;min-height:520px;animation:flip .45s ease}
.page:before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
.page .holes{position:absolute;left:12px;top:40px;bottom:40px;display:flex;flex-direction:column;justify-content:space-around}
.page .holes i{width:14px;height:14px;border-radius:50%;background:var(--desk);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
@keyframes flip{from{opacity:0;transform:perspective(1200px) rotateY(-12deg) translateX(30px)}to{opacity:1;transform:none}}
@media (max-width:600px){.page{padding:26px 18px 26px 44px}.page:before{left:30px}.page .holes{left:7px}.page .holes i{width:11px;height:11px}}

.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--lila);color:var(--violet)}
.kicker.think{background:var(--gold2);color:#9A5B00}
.kicker.bonus{background:#FFF2C4;color:#8A6400}
.kicker svg{width:14px;height:14px;fill:currentColor}
h1{font-size:30px;line-height:1.15;margin:12px 0 6px;font-weight:800}
h2{font-size:22px;margin:22px 0 8px;font-weight:800}
p{font-size:17px;line-height:1.55;margin:8px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.meta span{font-size:13px;font-weight:700;background:#fff;border:1.5px solid #D8D0E8;color:var(--ink2);padding:3px 10px;border-radius:999px}
.task{background:var(--lila);border-left:5px solid var(--violet);border-radius:8px;padding:12px 16px;margin:14px 0;font-size:17px;line-height:1.5}
.task b{color:var(--violet)}
.note{background:var(--gold2);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:16px;line-height:1.5}
.helen{font-family:'Patrick Hand',cursive;font-size:22px;line-height:1.45;color:#2B4A8B}
.sticky{background:#FFF6A8;padding:14px 18px;transform:rotate(-1.2deg);box-shadow:0 4px 10px rgba(0,0,0,.12);border-radius:2px;margin:16px 0}

.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:800;background:var(--violet);color:#fff;box-shadow:0 3px 0 #4A3577;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4A3577}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #C98516}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:#7A6F96;font-weight:600}

/* Bilder */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media (max-width:640px){.gal{grid-template-columns:repeat(2,1fr)}}
.pic{position:relative;background:#fff;padding:7px 7px 30px;box-shadow:0 3px 10px rgba(0,0,0,.15);border-radius:3px;transition:.2s;border:3px solid transparent}
.pic:nth-child(odd){transform:rotate(-1.3deg)} .pic:nth-child(even){transform:rotate(1.1deg)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fafafa;display:block}
.pic .l{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:'Patrick Hand';font-size:20px;color:var(--violet)}
.pic .tape{position:absolute;top:-9px;left:50%;width:56px;height:18px;margin-left:-28px;background:rgba(242,169,59,.45);transform:rotate(-3deg)}
.pic.sel{border-color:var(--gold);transform:scale(1.03)}
.pic.tap{cursor:pointer}
.pic .got{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pic.gotit{border-color:var(--green)}
.chips{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.chip{text-align:left;border:2px solid #D8D0E8;background:#fff;border-radius:12px;padding:11px 14px;font-size:16px;font-weight:700;color:var(--ink);transition:.15s}
.chip.on{border-color:var(--gold);background:var(--gold2);box-shadow:0 0 0 3px rgba(242,169,59,.3)}
.chip.ok{border-color:var(--green);background:#E8F4EA;color:#2D6B38}
.chip.ok:after{content:" ✓"}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Quiz */
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid #D8D0E8;background:#fff;border-radius:12px;padding:13px 16px;font-size:16.5px;font-weight:600;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.opt b{display:inline-flex;min-width:28px;height:28px;border-radius:50%;background:var(--lila);color:var(--violet);align-items:center;justify-content:center;font-weight:800}
.opt.right{border-color:var(--green);background:#E8F4EA}
.opt.right b{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--coral);background:#FCEDEA;opacity:.75}
.opt.pick{border-color:var(--gold);background:var(--gold2)}
.expl{background:#E8F4EA;border-radius:10px;padding:12px 16px;margin-top:10px;font-size:16px;line-height:1.5;display:none}
.expl.show{display:block;animation:flip .3s}
textarea{width:100%;min-height:120px;border:2px solid #D8D0E8;border-radius:12px;padding:12px 14px;font-family:'Patrick Hand',cursive;font-size:21px;line-height:1.4;color:#2B4A8B;background:rgba(255,255,255,.92);resize:vertical}
textarea:focus{outline:none;border-color:var(--violet)}
.cnt{font-size:13px;font-weight:700;color:#7A6F96;text-align:right;margin-top:4px}
.cnt.ok{color:var(--green)}

/* Tagebuch */
.diary{background:#FFFDF6;border:1px solid #EADFC8;border-radius:6px;padding:18px 20px;box-shadow:0 3px 10px rgba(0,0,0,.08);margin:14px 0}
.diary .d{font-family:'Patrick Hand';font-size:15px;color:#9A8F7A}
.sent{display:block;margin:10px 0;padding:8px 10px;border-radius:8px;background:rgba(242,169,59,.12)}
.sent .txt{font-family:'Patrick Hand';font-size:21px;line-height:1.35;color:#2B4A8B}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cat{border:2px solid #D8D0E8;background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;color:var(--ink2)}
.cat.right{background:var(--green);border-color:var(--green);color:#fff}
.cat.wrong{background:#FCEDEA;border-color:var(--coral);color:var(--coral);text-decoration:line-through}
.cat:disabled{cursor:default}

/* Symbole */
.syms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media (max-width:640px){.syms{grid-template-columns:repeat(2,1fr)}}
.sym{background:#fff;border:2px solid #D8D0E8;border-radius:14px;padding:14px 8px;text-align:center;transition:.15s;position:relative}
.sym svg{width:40px;height:40px;fill:var(--violet)}
.sym .n{font-weight:800;font-size:17px;margin-top:6px}
.sym .r{font-size:12.5px;color:#7A6F96;font-weight:700}
.sym.ok{border-color:var(--green);background:#E8F4EA} .sym.ok svg{fill:var(--green)}
.sym .m{font-size:13px;font-weight:700;color:#2D6B38;margin-top:6px;line-height:1.3}

/* Elefant */
.ele{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start;margin:12px 0}
@media (max-width:640px){.ele{grid-template-columns:1fr}}
.ele img{width:100%;border:7px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:rotate(-1deg)}
.feel{display:flex;flex-direction:column;gap:8px}
.bubble{background:#fff;border:2px solid #D8D0E8;border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;text-align:left}
.story{background:#FFFDF6;border:1px solid #EADFC8;border-radius:8px;padding:16px 20px;margin:14px 0;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.story p{font-size:17px}
.bubble .q{display:none;font-family:'Patrick Hand';font-size:21px;color:#2B4A8B;font-weight:400}
.bubble.open{border-color:var(--gold);background:var(--gold2)} .bubble.open .q{display:block}

/* Merksatz */
.merk{background:var(--ink);color:#fff;border-radius:16px;padding:20px 22px;font-size:18px;line-height:2.3;margin:14px 0}
.merk select{font-family:inherit;font-size:16px;font-weight:700;border-radius:8px;border:2px solid var(--gold);padding:3px 6px;background:#fff;color:var(--ink);max-width:100%}
.merk select.right{border-color:#7BD389;background:#E8F4EA}
.merk select.wrong{border-color:var(--coral);background:#FCEDEA}
.merk .fix{color:#FFD978;font-weight:800;font-size:14px;margin-left:4px}

/* Ergebnisse (A4, 794 x 1123 px) */
.prev{margin:16px 0;display:flex;flex-direction:column;gap:16px;align-items:center}
.prev .sc{overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:4px}
.prev .sc>.a4{transform-origin:0 0}
#cap{position:fixed;left:-20000px;top:0}
.a4{width:794px;height:1123px;background:#fff;padding:38px 46px;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;color:#2E2347}
.a4 .hd{background:#2E2347;color:#fff;border-radius:16px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.a4 .hd .t{font-size:24px;font-weight:800;line-height:1.1}
.a4 .hd .k{font-size:11px;font-weight:800;color:#F2A93B;letter-spacing:1px}
.a4 .hd .tm{text-align:right;font-size:13px;color:#CFC6E4;font-weight:700}
.a4 .hd .tm b{display:block;color:#fff;font-size:16px}
.a4 .sec{margin-top:16px}
.a4 .st{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;margin-bottom:7px}
.a4 .st i{font-style:normal;width:24px;height:24px;border-radius:50%;background:#F2A93B;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.a4 .st span{font-size:11px;font-weight:700;color:#8A7FA6;margin-left:4px}
.a4 .thumbs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.a4 .thumbs div{text-align:center;font-size:10.5px;line-height:1.25;font-weight:600}
.a4 .thumbs img{width:100%;height:66px;object-fit:contain;border:1px solid #E4DEEF;border-radius:4px;background:#fafafa;margin-bottom:3px}
.a4 .thumbs b{color:#6B4FA0}
.a4 .box{background:#F4F0FA;border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.45}
.a4 .ans{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.3;color:#2B4A8B;background:#fff;border:1.5px solid #D8D0E8;border-radius:10px;padding:7px 12px;margin-top:6px;min-height:40px}
.a4 .row{display:flex;gap:12px;align-items:flex-start}
.a4 .draw{flex:1;border:2px dashed #A99BC6;border-radius:12px;height:390px;padding:8px 12px;font-weight:800;font-size:14px}
.a4 .draw small{display:block;font-weight:600;color:#8A7FA6;font-size:11px}
.a4 .syms4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.a4 .syms4 div{background:#F4F0FA;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35}
.a4 .syms4 b{display:block;font-size:14px;color:#6B4FA0}
.a4 .cats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.a4 .cats4 div{border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.35;border:1.5px solid #D8D0E8}
.a4 .cats4 b{display:block;font-size:13.5px;margin-bottom:3px}
.a4 .merk2{background:#2E2347;color:#fff;border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.6}
.a4 .merk2 u{text-decoration:none;color:#F2A93B;font-weight:800;border-bottom:2px solid #F2A93B}
.a4 .lines div{height:36px;border-bottom:1.5px solid #C9C0DC}
.a4 .ft{position:absolute;bottom:16px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:10px;color:#A99BC6}
.exp{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}

/* Start & Ziel */
.cover{text-align:center;padding-top:20px}
.cover .label{display:inline-block;background:#fff;border:2px solid var(--ink2);border-radius:8px;padding:18px 34px;transform:rotate(-1.5deg);box-shadow:0 3px 0 var(--ink2)}
.cover .label .f{font-family:'Patrick Hand';font-size:46px;color:#2B4A8B;line-height:1}
.cover .label .s{font-family:'Patrick Hand';font-size:22px;color:#2B4A8B}
input[type=text]{font-family:inherit;font-size:18px;font-weight:700;border:2px solid #D8D0E8;border-radius:12px;padding:12px 14px;width:100%;max-width:420px;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--violet)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0;text-align:left}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rules div{background:var(--lila);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.rules b{display:block;color:var(--violet);font-size:16px;margin-bottom:2px}
.card{background:var(--ink);color:#fff;border-radius:18px;padding:26px;text-align:center;margin:18px auto;max-width:520px;box-shadow:0 8px 24px rgba(46,35,71,.3)}
.card .big{font-size:58px;font-weight:800;color:var(--gold);line-height:1}
.card .rank{font-family:'Patrick Hand';font-size:30px;margin:10px 0 4px}
.card .code{display:inline-block;margin-top:14px;background:#fff;color:var(--ink);font-weight:800;letter-spacing:3px;padding:8px 16px;border-radius:10px;font-size:22px}
.stats{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}
.stats b{display:block;font-size:20px}
.credit{text-align:center;font-size:12px;color:#8A7F6A;margin-top:16px}
.teacher{position:fixed;bottom:0;left:0;right:0;background:var(--red);color:#fff;text-align:center;font-size:13px;font-weight:800;padding:5px;z-index:30}
.sol{display:none;margin-top:10px;background:#FDECEC;border:2px dashed var(--red);border-radius:10px;padding:10px 14px;font-size:14.5px;color:#8B1C1C;line-height:1.5}
body.lehrer .sol{display:block}
.reset{background:none;border:none;color:#9A8F7A;font-size:12px;font-weight:700;text-decoration:underline;margin-top:10px}
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <div class="row">
    <div class="team" id="teamName"></div>
    <div class="pill" title="Zeit"><svg stroke="currentColor" stroke-width="0" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120l0 136c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2 280 120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"></path></svg><span id="time">0:00</span></div>
    <div class="pill pts" title="Punkte"><svg stroke="currentColor" stroke-width="0" viewBox="0 0 576 512" xmlns="http://www.w3.org/2000/svg"><path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"></path></svg><span id="pts">0</span></div>
    <button class="pill" id="rsb" onclick="hdrReset(this)" title="Neu starten (zweimal tippen)" style="border:none;color:#fff;font-family:inherit;cursor:pointer">↺</button>
  </div>
  <div class="prog" id="prog"></div>
</div>
<div class="pop" id="pop"></div>
<div class="wrap"><div class="page" id="page"></div>

const LEHRER=/[?&]lehrer\b/.test(location.search);
if(LEHRER){document.body.classList.add('lehrer');document.body.insertAdjacentHTML('beforeend','<div class="teacher">LEHRKRAFT-MODUS · Lösungen sichtbar · alle Seiten frei</div>');}

/* ---------- Zustand ---------- */
const KEY='helens-heft-v1';
let S=load()||{team:'',page:0,pts:0,start:0,end:0,done:{},data:{}};
if(/[?&]neu\b/.test(location.search)){try{localStorage.removeItem(KEY)}catch(e){}S={team:'',page:0,pts:0,start:0,end:0,done:{},data:{}};const q=location.search.replace(/[?&]neu\b/,'').replace(/^&/,'?');history.replaceState(null,'',location.pathname+(q==='?'?'':q))}
function hdrReset(b){if(b.dataset.c){try{localStorage.removeItem(KEY)}catch(e){}S={team:'',page:0,pts:0,start:0,end:0,done:{},data:{}};S.page=0;render(true);return}
  b.dataset.c=1;b.textContent='Neu starten?';setTimeout(()=>{b.dataset.c='';b.textContent='↺'},3000)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function addPts(n,label){if(!n)return;S.pts+=n;save();upd();const p=document.getElementById('pop');p.textContent=(n>0?'+':'')+n+' Punkte'+(label?' · '+label:'');p.className='pop show'+(n<0?' neg':'');clearTimeout(p._t);p._t=setTimeout(()=>p.className='pop',1300)}
function D(k,v){if(v===undefined)return S.data[k];S.data[k]=v;save()}
function finish(id){if(!S.done[id]){S.done[id]=true;save()}render(false)}

/* ---------- Seiten ---------- */
const PAGES=[
 {id:'start',label:'Start'},
 {id:'intro',label:'Helen'},
 {id:'s1',label:'Station 1'},
 {id:'d1',label:'Denkpause'},
 {id:'s2',label:'Station 2'},
 {id:'s3',label:'Station 3'},
 {id:'d2',label:'Denkpause'},
 {id:'s4',label:'Station 4'},
 {id:'s5',label:'Station 5'},
 {id:'d3',label:'Denkpause'},
 {id:'s6',label:'Station 6'},
 {id:'bonus',label:'Bonus',bonus:true},
 {id:'ziel',label:'Ziel'},
 {id:'ergebnis',label:'Ergebnisse'}
];
const MAX=235, MAXB=255;

function upd(){
  document.getElementById('pts').textContent=S.pts;
  document.getElementById('teamName').innerHTML=esc(S.team)+'<small>HELENS RELIGIONSHEFT</small>';
  const pr=document.getElementById('prog');
  pr.innerHTML=PAGES.slice(1).map((p,i)=>`<span title="${p.label}" class="${p.bonus?'bonus ':''}${S.done[p.id]?'done':''} ${S.page===i+1?'now':''}"></span>`).join('');
}
function tick(){if(!S.start)return;if(!S.end&&document.visibilityState==='visible'){S.el=(S.el||0)+1;if(S.el%5===0)save()}const t=S.el||0;document.getElementById('time').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
setInterval(tick,1000);
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a,seed){a=a.slice();let s=seed||7;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function go(i){S.page=Math.max(0,Math.min(PAGES.length-1,i));save();render(true);window.scrollTo({top:0,behavior:'smooth'})}
function canNext(){const id=PAGES[S.page].id;return LEHRER||S.done[id]||id==='intro'||id==='ziel'}
function nav(extra){
  const i=S.page,last=i===PAGES.length-1;
  const nxt=PAGES[i+1];
  const lbl=nxt?(nxt.id==='bonus'?'Zur ⭐ Bonusseite':nxt.id==='ziel'?'Zur Punktekarte':nxt.id==='ergebnis'?'Unsere Ergebnisse':'Umblättern'):'';
  return `<div class="nav"><button class="btn ghost" onclick="go(${i-1})" ${i<=1?'style="visibility:hidden"':''}>← Zurück</button>
  ${extra||''}
  ${last?'':`<button class="btn gold" id="next" onclick="nextPage()" ${canNext()?'':'disabled'}>${lbl} →</button>`}</div>
  ${canNext()||last?'':'<div class="hint" style="text-align:right;margin-top:6px">Erst die Aufgabe lösen, dann geht es weiter.</div>'}`;
}
function nextPage(){if(PAGES[S.page].id==='intro'||PAGES[S.page].id==='ziel')S.done[PAGES[S.page].id]=true;if(PAGES[S.page+1].id==='ziel'&&!S.end){S.end=Date.now();save()}go(S.page+1)}
function holes(){return '<div class="holes">'+'<i></i>'.repeat(5)+'</div>'}
function kick(type,txt){const ic=type==='think'?ICON.bulb:type==='bonus'?ICON.star:ICON.book;return `<span class="kicker ${type||''}">${ic}${txt}</span>`}

function render(anim){
  const pg=document.getElementById('page'),p=PAGES[S.page];
  document.getElementById('bar').style.display=S.page===0?'none':'block';
  upd();tick();
  pg.innerHTML=holes()+R[p.id]();
  if(anim){pg.style.animation='none';pg.offsetHeight;pg.style.animation=''}
  if(H[p.id])H[p.id]();
}
const R={},H={};

/* ---------- START ---------- */
R.start=()=>`<div class="cover">
  <div class="label"><div class="f">Religion</div><div class="s">Helen · Klasse 2b</div></div>
  <h1 style="margin-top:28px">Helens Religionsheft</h1>
  <p>Evangelische Religionslehre 10 · Die Frage nach Gott</p>
  <div class="rules">
    <div><b>Zu zweit</b>Ihr arbeitet als Team mit einem iPad. Euer GoodNotes-Heft liegt bereit.</div>
    <div><b>Punkte sammeln</b>Richtig beim ersten Versuch bringt die meisten Punkte. Raten lohnt sich nicht!</div>
    <div><b>⭐ Bonus</b>Wer schnell ist, schaltet am Ende eine Bonusseite frei.</div>
  </div>
  <p style="font-weight:700">Wie heißt euer Team?</p>
  <input type="text" id="team" maxlength="30" placeholder="z. B. Lena & Ben" value="${esc(S.team)}">
  <div style="margin-top:18px"><button class="btn gold" onclick="startGame()">Heft aufschlagen →</button></div>
  ${S.start?`<div><button class="reset" onclick="resetAll(this)">Von vorne beginnen</button></div>`:''}
</div>`;
function startGame(){const t=document.getElementById('team').value.trim();if(t.length<2){document.getElementById('team').classList.add('shake');setTimeout(()=>document.getElementById('team').classList.remove('shake'),400);return}
  S.team=t;if(!S.start)S.start=Date.now();S.done.start=true;save();go(Math.max(1,S.page||1))}

/* ---------- Multiple Choice Helfer ---------- */
function mc(id,q,opts,right,expl,pts){const a=D(id);const tries=D(id+'t')||[];
  return `<p style="font-weight:700;font-size:18px">${q}</p><div class="opts" data-mc="${id}">${opts.map((o,i)=>{
    let c='';if(a!==undefined&&i===right)c='right';else if(tries.includes(i))c='wrong';
    return `<button class="opt ${c}" data-i="${i}" ${a!==undefined?'disabled':''}><b>${'ABCD'[i]}</b><span>${o}</span></button>`}).join('')}</div>
  <div class="expl ${a!==undefined?'show':''}" id="${id}e">${expl}</div>`}
function mcH(id,right,pts,doneId){document.querySelectorAll(`[data-mc="${id}"] .opt`).forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,tries=D(id+'t')||[];
  if(i===right){D(id,i);addPts(tries.length===0?pts:tries.length===1?Math.round(pts/2):0,tries.length?'':'Volltreffer!');if(doneId){S.done[doneId]=true;save()}render(false)}
  else{tries.push(i);D(id+'t',tries);b.classList.add('wrong','shake');setTimeout(()=>b.classList.remove('shake'),400)}})}

/* ---------- Text Helfer ---------- */
function txt(id,ph,min){const v=D(id)||'';const done=D(id+'ok');
  return `<textarea id="${id}" maxlength="350" placeholder="${ph}" ${done?'readonly':''}>${esc(v)}</textarea>
  <div class="cnt" id="${id}c">${done?'✓ abgegeben':`noch ${Math.max(0,min-v.length)} Zeichen`}</div>`}
function txtH(id,min,pts,label,after){const t=document.getElementById(id);if(!t)return;const c=document.getElementById(id+'c');
  const b=document.getElementById(id+'b');
  t.oninput=()=>{D(id,t.value);const n=t.value.trim().length;c.textContent=n>=min?'✓ lang genug':'noch '+(min-n)+' Zeichen';c.className='cnt'+(n>=min?' ok':'');if(b)b.disabled=n<min};
  if(b){b.disabled=(t.value.trim().length<min);b.onclick=()=>{D(id+'ok',1);addPts(pts,label);after&&after()}}}

/* ---------- S6 Merksatz ---------- */
const GAPS=['Vorstellung','verändern','Erfahrungen','Wissen','Begegnungen','Teilbilder','größer'];
const REASONS=['Erfahrungen','Wissen','Begegnungen'];
// prüft jede Lücke; bei den drei Gründen (Lücke 2–4) zählt nur, dass jeder Grund einmal vorkommt
function s6check(a){const ok=a.map((x,i)=>i<2||i>4?x===GAPS[i]:false);const used=new Set();
  for(let i=2;i<=4;i++){if(REASONS.includes(a[i])&&!used.has(a[i])){ok[i]=true;used.add(a[i])}}
  const miss=REASONS.filter(r=>!used.has(r));const fix={};for(let i=2;i<=4;i++)if(!ok[i])fix[i]=miss.shift();
  for(let i of [0,1,5,6])if(!ok[i])fix[i]=GAPS[i];return {ok,fix,n:ok.filter(Boolean).length}}
function s6final(){const a=D('s6a');if(!a)return GAPS;const c=s6check(a);return a.map((x,i)=>c.ok[i]?x:c.fix[i])}
R.s6=()=>{const a=D('s6a');const opts=shuffle(GAPS,5);const c=a?s6check(a):null;
  const sel=i=>`<select data-i="${i}" ${a?'disabled':''} class="${a?(c.ok[i]?'right':'wrong'):''}"><option value="">…</option>${opts.map(o=>`<option ${a&&a[i]===o?'selected':''}>${o}</option>`).join('')}</select>${a&&!c.ok[i]?`<span class="fix">→ ${c.fix[i]}</span>`:''}`;
  return `${kick('','Station 6 · allein · 3 Min.')}
<h1>Das nehme ich mit</h1>
<div class="task"><b>Auftrag:</b> Ergänze den Merksatz. Du hast nur <b>einen</b> Prüfversuch (je 5 Punkte). Die drei Beispiele nach „durch“ dürfen in beliebiger Reihenfolge stehen.</div>
<div class="merk">Jeder Mensch hat eine eigene ${sel(0)} von Gott. Gottesbilder ${sel(1)} sich im Lauf des Lebens – zum Beispiel durch ${sel(2)}, ${sel(3)} und ${sel(4)}. Alle Bilder von Gott sind nur ${sel(5)}: Gott ist ${sel(6)} als jede menschliche Vorstellung.</div>
${a?'':'<button class="btn" id="s6b">Prüfen</button>'}
<div class="sol">Vorstellung · verändern · Erfahrungen · Wissen · Begegnungen · Teilbilder · größer (Reihenfolge der drei Gründe egal)</div>
${nav()}`};
H.s6=()=>{const b=document.getElementById('s6b');if(!b)return;b.onclick=()=>{

function code(){const t=S.el||0;const c=(S.pts*37+Math.floor(t/60)*11+S.team.length*7)%97;return S.pts+'-'+String(c).padStart(2,'0')}

  const rank=pct>=.9?'Theologie-Profis':pct>=.7?'Echte Gottsucher':pct>=.5?'Gut unterwegs':'Auf dem Weg';

${LEHRER?`<div class="sol" style="display:block"><b>Code prüfen:</b> <input type="text" id="cc" placeholder="z. B. 212-34" style="max-width:180px;font-size:15px;padding:6px 10px"> Team: <input type="text" id="ct" placeholder="Teamname" style="max-width:180px;font-size:15px;padding:6px 10px"> Minuten: <input type="text" id="cm" placeholder="17" style="max-width:70px;font-size:15px;padding:6px 10px"> <button class="btn" style="padding:6px 12px;font-size:14px" onclick="chk()">Prüfen</button> <span id="cr"></span></div>`:''}
${nav(`<button class="reset" onclick="resetAll(this)">Neues Team starten</button>`)}`};
/* ---------- Ergebnisse ---------- */
function A(id){return esc(D(id)||'')||'<span style="color:#B0A6C6">– (noch nicht bearbeitet)</span>'}
function resultPages(){
  const t=S.el||0;
  const pick=D('s2pick');const g=s6final();
  const hd=`<div class="hd"><div><div class="k">EVANGELISCHE RELIGIONSLEHRE 10 · DIE FRAGE NACH GOTT</div><div class="t">Helens Religionsheft – unsere Ergebnisse</div></div><div class="tm">Team<b>${esc(S.team)}</b>${S.pts} Punkte · ${Math.floor(t/60)} Min.</div></div>`;

  const byCat=CATS.map((c,j)=>({c,items:SENT.filter(x=>x[1]===j).map(x=>x[0])}));
  const catCol=['#3E9C9E','#6B4FA0','#E46F5B','#4E9A5B'];
  const p1=`<div class="a4">${hd}
  <div class="sec"><div class="st"><i>1</i>Helens Bilder – so stellen sich Kinder Gott vor</div>
   <div class="thumbs">${['k1','k2','k3','k4','k5','k6','k7'].map(k=>`<div><img src="${IMG[k]}"><b>${L[k]}</b> ${S1.find(x=>x[0]===k)[1]}</div>`).join('')}</div></div>
  <div class="sec"><div class="st"><i>2</i>Wo ist eigentlich der Himmel?</div>
   <div class="box">„Himmel“ ist in der Bibel ein <b>Symbol</b>: nicht ein Ort über den Wolken (<i>sky</i>), sondern Gottes Wirklichkeit – dort, wo Gott ist und wirkt (<i>heaven</i>).</div></div>
  <div class="sec"><div class="st"><i>3</i>Ein Bild, das uns anspricht${pick?`<span>Bild ${L[pick]}</span>`:''}</div>
   <div class="row">${pick?`<img src="${IMG[pick]}" style="width:120px;height:90px;object-fit:contain;border:1px solid #E4DEEF;border-radius:6px;background:#fafafa">`:''}<div class="ans" style="flex:1;margin-top:0">${A('s2t')}</div></div></div>
  <div class="sec"><div class="st"><i>4</i>Mein Gottesbild<span>Zeichne oder schreibe hier in GoodNotes.</span></div>
   <div class="row"><div class="draw">Als Kind<small>Wo war Gott? Wie sah Gott aus?</small></div><div class="draw">Heute<small>Was ist geblieben? Was hat sich verändert?</small></div></div></div>
  ${ft(1)}</div>`;
  const p2=`<div class="a4">
  <div class="sec" style="margin-top:0"><div class="st"><i>5</i>Bilder sind Symbole</div>
   <div class="syms4">${SYM.map(x=>`<div><b>${x[1]}</b><span style="color:#8A7FA6">${x[2]}</span><br>${x[3]}</div>`).join('')}</div></div>
  <div class="sec"><div class="st"><i>6</i>Warum sich Gottesbilder verändern – Helens Gründe</div>
   <div class="cats4">${byCat.map((b,j)=>`<div style="border-color:${catCol[j]}"><b style="color:${catCol[j]}">${b.c}</b>${b.items.map(x=>'• '+x).join('<br>')}</div>`).join('')}</div>
   <div style="font-size:12.5px;font-weight:700;margin-top:8px">So würde Helen Gott heute zeichnen – unsere Idee:</div><div class="ans">${A('s4t')}</div></div>
  <div class="sec"><div class="st"><i>7</i>Die Blinden und der Elefant</div>
   <div class="box">Jeder erfasst nur einen Teil – das Ganze ist größer als jede einzelne Sicht. Alle Gottesbilder sind <b>Teilbilder</b>.</div>
   <div style="font-size:12.5px;font-weight:700;margin-top:8px">Was Helen und Aylin daraus lernen können:</div><div class="ans">${A('s5t')}</div></div>
  <div class="sec"><div class="st"><i>8</i>Knobelfrage: Der unhebbare Stein</div><div class="ans" style="margin-top:0">${A('d3t')}</div></div>
  <div class="sec"><div class="st"><i>9</i>Merksatz</div>
   <div class="merk2">Jeder Mensch hat eine eigene <u>${g[0]}</u> von Gott. Gottesbilder <u>${g[1]}</u> sich im Lauf des Lebens – zum Beispiel durch <u>${g[2]}</u>, <u>${g[3]}</u> und <u>${g[4]}</u>. Alle Bilder von Gott sind nur <u>${g[5]}</u>: Gott ist <u>${g[6]}</u> als jede menschliche Vorstellung.</div></div>
  <div class="sec"><div class="st"><i>?</i>Mein Fragenspeicher<span>Eine Frage, die ich zu Gott habe</span></div><div class="lines"><div></div><div></div><div></div></div></div>

  return [p1,p2];
}
R.ergebnis=()=>`${kick('','Für dein Heft')}
<h1>Unsere Ergebnisse</h1>
<p>Hier ist alles zusammengestellt, was ihr bearbeitet habt – auf zwei A4-Seiten. Erstellt daraus ein PDF und öffnet es in <b>GoodNotes</b>. Auf Seite 1 ist Platz für dein Gottesbild (Station 3).</p>
<div class="exp"><button class="btn gold" id="mkpdf">PDF erstellen</button><span class="hint" id="pdfst"></span></div>
<div class="prev" id="prev"></div>
<div class="note"><b>So kommt das PDF in GoodNotes:</b> „In GoodNotes öffnen“ tippen → im Teilen-Menü <b>GoodNotes</b> wählen → „Als neues Dokument importieren“ oder in dein Reli-Heft einfügen.</div>
${nav(`<button class="reset" onclick="resetAll(this)">Neues Team starten</button>`)}`;
H.ergebnis=()=>{S.done.ergebnis=true;save();upd();
  const pages=resultPages();const pv=document.getElementById('prev');
  const w=Math.min(pv.clientWidth,794),sc=w/794;
  pv.innerHTML=pages.map(h=>`<div class="sc" style="width:${794*sc}px;height:${1123*sc}px">${h}</div>`).join('');
  pv.querySelectorAll('.sc>.a4').forEach(e=>e.style.transform=`scale(${sc})`);
  document.getElementById('mkpdf').onclick=makePdf};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
let PDF=null;
async function makePdf(){const st=document.getElementById('pdfst'),b=document.getElementById('mkpdf');
  b.disabled=true;st.textContent='PDF wird erstellt …';
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    try{await document.fonts.ready}catch(e){}
    let cap=document.getElementById('cap');if(!cap){cap=document.createElement('div');cap.id='cap';document.body.appendChild(cap)}
    cap.innerHTML=resultPages().join('');
    const els=[...cap.querySelectorAll('.a4')],jpgs=[];
    for(let i=0;i<els.length;i++){
      st.textContent=`Seite ${i+1} von ${els.length} …`;
      const c=await html2canvas(els[i],{scale:2.6,backgroundColor:'#ffffff',logging:false});
      const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));jpgs.push({w:c.width,h:c.height,b:new Uint8Array(await bl.arrayBuffer())});
    }
    cap.innerHTML='';
    const name='Helens_Religionsheft_'+(S.team||'Team').replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_')+'.pdf';
    PDF=new File([imagePdf(jpgs)],name,{type:'application/pdf'});
    st.textContent='';
    b.outerHTML=`<button class="btn gold" id="share">In GoodNotes öffnen</button><button class="btn ghost" id="dl">PDF herunterladen</button>`;
    const sh=document.getElementById('share');
    if(navigator.canShare&&navigator.canShare({files:[PDF]})){sh.onclick=()=>navigator.share({files:[PDF],title:'Helens Religionsheft'}).catch(()=>{})}
    else sh.remove();
    document.getElementById('dl').onclick=()=>{const u=URL.createObjectURL(PDF);const a=document.createElement('a');a.href=u;a.download=PDF.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
  }catch(e){st.textContent='Das PDF konnte nicht erstellt werden. Ist das iPad mit dem Internet verbunden?';b.disabled=false;console.error(e)}
}
/* Minimaler PDF-Baustein: pro Seite genau ein JPEG, keine Schriften (GoodNotes-freundlich) */
function imagePdf(imgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n=imgs.length,W=595.28,Hh=841.89;const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n')};
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add('<< /Type /Pages /Count '+n+' /Kids ['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
  imgs.forEach((im,i)=>{const pg=3+i*3,ct=pg+1,ix=pg+2;const cs='q '+W+' 0 0 '+Hh+' 0 0 cm /Im0 Do Q';
    obj(pg,()=>add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+Hh+'] /Resources << /XObject << /Im0 '+ix+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(ct,()=>add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(ix,()=>{add('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.b.length+' >>\nstream\n');add(im.b);add('\nendstream')})});
  const total=3+n*3,x=len;let xr='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(xr+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'})}
function chk(){const [p,c]=document.getElementById('cc').value.split('-').map(x=>parseInt(x));const tl=document.getElementById('ct').value.trim().length;const m=parseInt(document.getElementById('cm').value);
  const ok=(p*37+m*11+tl*7)%97===c;document.getElementById('cr').textContent=ok?'✓ Code passt':'✗ Code passt nicht';}

render(true);
